[project]
name = "bank-ai-chat"
version = "1.0.0"
description = "FISC and APPI Compliant Japanese Banking AI Assistant System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "boto3>=1.28.0",
    "requests>=2.28.0",
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "botocore[crt]>=1.43.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
    "ignore::DeprecationWarning:starlette.*",
]

