name: Japanese Bank AI Portal Production CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Target Deployment Compute'
        required: true
        default: 'ecs_fargate'
        type: choice
        options:
        - ecs_fargate
        - apprunner

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: bank-ai-chat-app
  ECS_CLUSTER: bank-ai-production-cluster
  ECS_SERVICE: bank-ai-backend-service
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: bank-ai-container
  APPRUNNER_SERVICE_NAME: bank-ai-chat-service

jobs:
  test-and-security-scan:
    name: Run Unit Tests & Security SAST Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install bandit pytest

    - name: Execute Automated Unit Tests (Pytest)
      run: |
        pytest tests/ -v

    - name: Run In-VPC Guardrail Safety Verification
      run: |
        python3 -c "
        from src.control_plane.input_guardrail import InputGuardrail
        ig = InputGuardrail()
        result = ig.process_input('口座 1234567')
        assert result['pii_detected'] == True
        print('Input Guardrail Verification: PASSED')
        "

    - name: Run Bandit Security SAST Scan
      run: |
        bandit -r src/ -x tests/ || true

  build-and-deploy:
    name: Build Container Image & Deploy to AWS Tokyo
    needs: test-and-security-scan
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials (OIDC IAM Role)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID || '665192915466' }}:role/GitHubActionsDeployRole
        role-session-name: GitHubActionsBankAiDeploySession
        aws-region: ${{ env.AWS_REGION }}

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, Tag, and Test Docker Container Image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Run Trivy Container Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Push Container Image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    # Deployment Branch A: AWS ECS Fargate
    - name: Render AWS ECS Task Definition
      if: ${{ github.event.inputs.deployment_target == 'ecs_fargate' || github.event_name == 'push' }}
      id: render-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy to AWS ECS Fargate Service
      if: ${{ github.event.inputs.deployment_target == 'ecs_fargate' || github.event_name == 'push' }}
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.render-task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
      continue-on-error: true

    # Deployment Branch B: AWS App Runner (Staging / Fast Public Endpoint)
    - name: Deploy to AWS App Runner Service
      if: ${{ github.event.inputs.deployment_target == 'apprunner' }}
      run: |
        echo "Deploying update to AWS App Runner..."
        SERVICE_ARN=$(aws apprunner list-services --region ${{ env.AWS_REGION }} --query "ServiceSummaryList[?ServiceName=='${{ env.APPRUNNER_SERVICE_NAME }}'].ServiceArn" --output text)
        if [ -n "$SERVICE_ARN" ] && [ "$SERVICE_ARN" != "None" ]; then
          aws apprunner start-deployment --service-arn $SERVICE_ARN --region ${{ env.AWS_REGION }}
        else
          echo "App Runner service not yet created. Skipping auto-trigger."
        fi
