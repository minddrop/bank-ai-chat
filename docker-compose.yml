version: '3.8'

services:
  bank-ai-chat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-ai-chat-service
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=local
      - AWS_DEFAULT_REGION=ap-northeast-1
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
